name: Publish CLI to npm

on:
  push:
    tags: ['npm-v*']

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15-intel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate tag and repository metadata
        run: node scripts/check-release.mjs npm "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:package
      - name: Publish with npm trusted publishing
        run: |
          DIST_TAG=latest
          if [[ "$RELEASE_TAG" == *-*.*.*-* ]]; then DIST_TAG=next; fi
          npm publish --access public --tag "$DIST_TAG" --ignore-scripts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
