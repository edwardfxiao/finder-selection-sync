</style>
<script>
(() => {
  const root = document.getElementById('finder-desktop-concepts');
  const modes = {
    orphans: { title: '按参考清理', icon: 'folders', subtitle: '保留参考格式，找出没有对应原片的文件。' },
    tags: { title: 'Finder 标签', icon: 'tags', subtitle: '把选片结果同步到导出文件，或批量设置标签。' },
    list: { title: '按名单整理', icon: 'list-checks', subtitle: '用一份文件名名单，决定哪些文件保留或移走。' }
  };
  const refs = [
    { name: 'DSC_1042.NEF', tags: ['精选'] },
    { name: 'DSC_1048.NEF', tags: ['待修'] },
    { name: 'DSC_1060.NEF', tags: [] }
  ];
  const files = [
    { id: 'a', name: 'DSC_1042.JPG', path: 'DSC_1042.JPG', size: 8.2, tags: [] },
    { id: 'b', name: 'DSC_1042.XMP', path: 'DSC_1042.XMP', size: .1, tags: ['交付'] },
    { id: 'c', name: 'DSC_1043.JPG', path: 'DSC_1043.JPG', size: 7.6, tags: [] },
    { id: 'd', name: 'DSC_1043.XMP', path: 'DSC_1043.XMP', size: .1, tags: [] },
    { id: 'e', name: 'DSC_1048-[web].JPG', path: 'DSC_1048-[web].JPG', size: 2.3, tags: ['交付'] },
    { id: 'f', name: 'DSC_1042.JPG', path: '第二天/DSC_1042.JPG', size: 6.4, tags: [] },
    { id: 'g', name: 'DSC_1050.NEF', path: 'DSC_1050.NEF', size: 24.5, tags: [] },
    { id: 'h', name: 'README', path: 'README', size: .1, tags: [] }
  ];
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const baseName = p => p.slice(p.lastIndexOf('/') + 1);
  const extension = p => baseName(p).includes('.') ? baseName(p).split('.').pop().toLowerCase() : '';
  const stem = p => { const i = p.lastIndexOf('.'); return i < 0 ? p : p.slice(0, i); };
  const fold = p => p.normalize('NFC').toLocaleLowerCase('en-US');
  const tagKey = p => fold(stem(baseName(p)).split('-[')[0]);
  const tone = tag => tag === '精选' ? 'green' : tag === '待修' ? 'red' : tag === '绿色' ? 'green' : 'blue';
  const tagText = values => values.length ? values.map(t => `<span><span class="fs-dot" style="background:var(--fs-${tone(t)})"></span> ${esc(t)}</span>`).join(' · ') : '无标签';
  const apps = [];
  const shared = { compact: false, reasons: true };
  const saved = window.openai?.widgetState?.privateContent?.apps;
  function persist() {
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: { topic: 'Finder Selection Sync 桌面交互', designs: apps.map(a => ({ layout: a.layout, task: modes[a.state.mode].title, stage: a.state.step })) },
        privateContent: { apps: apps.map(a => ({ ...a.state, dialog: false, completed: null })) }
      }).catch(() => {});
    }
  }
  function hydrate(value) {
    const s = { mode: 'orphans', step: 1, reference: 'NEF', match: 'relative', listMode: 'keep', listMatch: 'name',
      list: 'DSC_1042.JPG\nDSC_1048-[web].JPG', ignoreCase: false, tagMode: 'sync', merge: true, selection: 'matched',
      preview: true, excluded: [], focused: 'e', onlyChanges: false, dialog: false, completed: null };
    if (value && modes[value.mode]) {
      for (const key of Object.keys(s)) if (typeof value[key] === typeof s[key] && key !== 'dialog' && key !== 'completed') s[key] = value[key];
      s.step = [1, 2, 3].includes(s.step) ? s.step : 1;
      s.excluded = Array.isArray(s.excluded) ? s.excluded.filter(id => files.some(f => f.id === id)) : [];
      s.match = ['relative', 'name'].includes(s.match) ? s.match : 'relative';
      s.listMode = ['keep', 'delete'].includes(s.listMode) ? s.listMode : 'keep';
      s.listMatch = ['name', 'relative', 'stem'].includes(s.listMatch) ? s.listMatch : 'name';
      s.tagMode = ['sync', 'color', 'clear'].includes(s.tagMode) ? s.tagMode : 'sync';
      s.selection = ['matched', 'unmatched', 'all'].includes(s.selection) ? s.selection : 'matched';
    }
    return s;
  }
  function derive(s) {
    let error = '';
    const ext = s.reference.trim().replace(/^\./, '').toLowerCase();
    const referenceFiles = refs.filter(r => extension(r.name) === ext);
    if (s.mode === 'orphans' && !/^[a-z0-9]+$/.test(ext)) error = '请输入一个参考扩展名，例如 NEF。';
    else if (s.mode === 'orphans' && !referenceFiles.length) error = `示例参考目录里没有 .${ext.toUpperCase()} 文件。请改回 NEF，或在正式应用中更换参考目录。`;
    const lines = s.list.replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).filter(v => v.trim() !== '');
    if (s.mode === 'list' && !lines.length) error = '名单为空，请先添加需要匹配的文件名。';
    if (s.mode === 'list' && s.list.includes('\0')) error = '名单不能包含空字符。';
    if (s.mode === 'list' && lines.some(v => v.endsWith('/') || (s.listMatch === 'relative' && (v.startsWith('/') || v.split('/').includes('..') || v === '.')))) error = '名单需要有效的文件名；相对路径不能是绝对路径或包含上级目录。';
    const listKey = p => {
      let key = s.listMatch === 'relative' ? p.replace(/^\.\//, '').replace(/\/+/g, '/') : s.listMatch === 'stem' ? stem(baseName(p)) : baseName(p);
      return s.ignoreCase ? fold(key) : key.normalize('NFC');
    };
    const listKeys = new Set(lines.map(listKey));
    const rows = files.map(f => {
      let candidate = false, match = '', reason = '', nextTags = null;
      if (s.mode === 'orphans') {
        const source = referenceFiles.find(r => fold(stem(r.name)) === fold(stem(s.match === 'name' ? f.name : f.path)));
        if (extension(f.name) === ext) { match = '参考格式'; reason = `.${ext.toUpperCase()} 是受保护的参考格式，即使出现在目标目录也保留。`; }
        else if (!extension(f.name)) { match = '无扩展名'; reason = '没有扩展名的文件不会参与按参考清理。'; }
        else if (source) { match = source.name; reason = `与 ${source.name} 的${s.match === 'relative' ? '相对目录和' : ''}文件名主体一致，保留。`; }
        else {
          candidate = true; match = '没有对应参考';
          reason = f.id === 'e' ? '清理时保留 -[web] 后缀。DSC_1048-[web] 与 DSC_1048 不同，因此没有对应参考。'
            : f.id === 'f' ? '默认也比较相对目录。“第二天”里没有同名参考；改成“只比较文件名”会保留它。'
            : `参考目录里没有 ${stem(f.name)}.${ext.toUpperCase()}，因此列入待清理。`;
        }
      } else if (s.mode === 'tags') {
        const source = refs.find(r => tagKey(r.name) === tagKey(f.name));
        match = source ? source.name : '没有同名参考';
        const picked = s.selection === 'all' || (s.selection === 'matched' ? Boolean(source) : !source);
        if (s.tagMode === 'sync') {
          if (source?.tags.length) { nextTags = s.merge ? [...new Set([...f.tags, ...source.tags])] : source.tags; }
          reason = source ? `匹配 ${source.name}。标签同步忽略扩展名、大小写、目录和 -[web] 一类后缀；${s.merge ? '保留目标原有标签并合并。' : '用参考标签替换全部目标标签。'}` : '没有对应的参考文件，不更改目标标签。';
        } else {
          if (picked) nextTags = s.tagMode === 'clear' ? [] : ['绿色'];
          reason = picked ? (s.tagMode === 'clear' ? '文件属于选定范围，清除其全部 Finder 标签。' : '文件属于选定范围，用单个绿色标签替换其全部 Finder 标签。') : '不属于选定范围，保持原有标签。';
        }
        candidate = nextTags !== null && [...nextTags].sort().join('|') !== [...f.tags].sort().join('|');
        if (nextTags !== null && !candidate) reason = '当前标签已经与计划一致，无需更改。';
      } else {
        const hit = listKeys.has(listKey(f.path));
        candidate = s.listMode === 'keep' ? !hit : hit;
        match = hit ? '在名单中' : '不在名单中';
        reason = `${s.listMatch === 'relative' ? '按相对路径' : s.listMatch === 'stem' ? '忽略扩展名，按文件名主体' : '按完整文件名（含扩展名）'}${s.ignoreCase ? '、忽略大小写' : '、区分大小写'}匹配。${hit ? '在' : '不在'}名单中，${candidate ? '列入待清理。' : '保留。'}`;
      }
      return { ...f, candidate: candidate && !error, selected: candidate && !error && !s.excluded.includes(f.id), match, reason, nextTags };
    });
    return { rows, error, selected: rows.filter(r => r.selected), candidates: rows.filter(r => r.candidate) };
  }
  function makeApp(el, index) {
    const app = { el, layout: el.dataset.layout, state: hydrate(saved?.[index]) };
    apps.push(app);
    let previewTimer;
    function invalidate(delay = 0) {
      app.state.preview = false; app.state.excluded = []; app.state.completed = null; app.state.dialog = false;
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => { app.state.preview = true; render(); persist(); }, delay);
    }
    function options(values, current) { return values.map(([v, text]) => `<option value="${v}" ${v === current ? 'selected' : ''}>${text}</option>`).join(''); }
    function folders(s) {
      return `<div class="fs-folders"><div class="fs-folder"><span class="fs-caption">${s.mode === 'list' ? '整理依据 · 示例名单' : '整理依据 · 参考目录'}</span><div class="fs-folder-name">${icon(s.mode === 'list' ? 'file-text' : 'folder')} ${s.mode === 'list' ? '客户选片.txt' : '精选原片'}</div><div class="fs-folder-path">${s.mode === 'list' ? '每行一个文件名 · 可在下方修改' : '旅拍 / 精选原片 · 3 个 NEF'}</div></div><div class="fs-arrow">${icon('arrow-right')}</div><div class="fs-folder"><span class="fs-caption">处理对象 · 目标目录</span><div class="fs-folder-name">${icon('folder-open')} 导出文件</div><div class="fs-folder-path">旅拍 / 导出文件 · 8 个示例文件</div></div></div>`;
    }
    function rules(s) {
      let fields = '', note = '';
      if (s.mode === 'orphans') {
        fields = `<label class="fs-field">参考格式 <input class="fs-input fs-ext" data-field="reference" value="${esc(s.reference)}" aria-label="参考格式"></label><label class="fs-field">匹配方式 <select class="fs-select" data-field="match">${options([['relative','目录 + 文件名'],['name','只比较文件名']],s.match)}</select></label>`;
        note = '所有其他扩展名都会参与清理，包括 XMP、PSD 和视频；不去除处理后缀。';
      } else if (s.mode === 'tags') {
        fields = `<label class="fs-field">操作 <select class="fs-select" data-field="tagMode">${options([['sync','同步参考标签'],['color','统一标为绿色'],['clear','清除标签']],s.tagMode)}</select></label>`;
        fields += s.tagMode === 'sync' ? `<label class="fs-toggle"><input type="checkbox" data-field="merge" ${s.merge ? 'checked' : ''}>保留目标原有标签</label>` : `<label class="fs-field">范围 <select class="fs-select" data-field="selection">${options([['matched','匹配的文件'],['unmatched','未匹配的文件'],['all','全部目标文件']],s.selection)}</select></label>`;
        note = s.tagMode === 'sync' ? '忽略目录、扩展名、大小写和 -[处理后缀]；默认跳过没有标签的参考文件。' : '“统一标为绿色”会替换已有标签；“清除标签”会移除全部标签。';
      } else {
        fields = `<label class="fs-field">名单用途 <select class="fs-select" data-field="listMode">${options([['keep','保留名单内文件'],['delete','移走名单内文件']],s.listMode)}</select></label><label class="fs-field">匹配 <select class="fs-select" data-field="listMatch">${options([['name','完整文件名'],['relative','相对路径'],['stem','不含扩展名']],s.listMatch)}</select></label><label class="fs-toggle"><input type="checkbox" data-field="ignoreCase" ${s.ignoreCase ? 'checked' : ''}>忽略大小写</label>`;
        note = s.listMode === 'keep' ? '名单外的文件会进入待清理，包括原片和附属文件。名单本身在正式应用中受保护。' : '只有名单内匹配到的文件会进入待清理。';
      }
      return `<div class="fs-rules">${fields}</div>${s.mode === 'list' ? `<textarea class="fs-input fs-textarea" data-field="list" aria-label="示例文件名单" spellcheck="false">${esc(s.list)}</textarea>` : ''}<div class="fs-rule-note">${note}</div>`;
    }
    function resultMarkup(s, d) {
      if (!s.preview) return '<div class="fs-notice" role="status">条件已变化，正在更新预览…</div>';
      if (d.error) return `<div class="fs-notice" data-error="true" role="alert">${esc(d.error)}</div>`;
      const rows = s.onlyChanges ? d.candidates : d.rows;
      const focused = d.rows.find(r => r.id === s.focused);
      const all = d.candidates.length > 0 && d.selected.length === d.candidates.length;
      return `<section class="fs-results" aria-label="文件预览"><div class="fs-result-head"><span class="fs-result-title">预览结果</span><span class="fs-count">${files.length} 个文件 · ${d.candidates.length} 项待处理</span><label class="fs-toggle"><input data-field="onlyChanges" type="checkbox" ${s.onlyChanges ? 'checked' : ''}>只看待处理</label></div><div class="fs-rows"><div class="fs-row fs-row-head"><input type="checkbox" data-action="select-all" aria-label="选择全部待处理文件" ${all ? 'checked' : ''} ${d.candidates.length ? '' : 'disabled'}><span>文件</span><span class="fs-match">${s.mode === 'tags' ? '当前 → 处理后' : '匹配依据'}</span><span>计划操作</span></div>${rows.map(r => `<div class="fs-row ${r.id === s.focused && shared.reasons ? 'is-focused' : ''}"><input type="checkbox" data-file="${r.id}" aria-label="处理 ${esc(r.path)}" ${r.selected ? 'checked' : ''} ${r.candidate ? '' : 'disabled'}><button class="fs-file-button cursor-interaction" data-inspect="${r.id}" aria-label="查看 ${esc(r.path)} 的处理原因"><span class="fs-file-name">${esc(r.name)}</span><span class="fs-file-meta">${r.path.includes('/') ? '第二天 / · ' : ''}${r.size.toFixed(1)} MB</span></button><div class="fs-match">${s.mode === 'tags' ? `${tagText(r.tags)}${r.candidate ? ` → ${tagText(r.nextTags)}` : ''}` : esc(r.match)}</div><span class="fs-status" data-kind="${r.selected ? s.mode === 'tags' ? 'tag' : 'change' : r.candidate ? 'skip' : 'keep'}">${r.selected ? s.mode === 'tags' ? '更新标签' : '移到废纸篓' : r.candidate ? '本次跳过' : s.mode === 'tags' ? '保持不变' : '保留'}</span></div>`).join('') || '<div class="fs-notice">没有需要处理的文件。</div>'}</div>${shared.reasons && focused ? `<div class="fs-detail" aria-live="polite"><strong>${esc(focused.path)}</strong><br>${esc(focused.reason)}</div>` : ''}</section>`;
    }
    function footer(s, d, wizard = false) {
      const total = d.selected.reduce((n, r) => n + r.size, 0).toFixed(1);
      return `<footer class="fs-footer"><div class="fs-footer-summary" role="status">${s.preview && !d.error ? `${d.selected.length} 个文件将${s.mode === 'tags' ? '更新标签' : '移到废纸篓'}` : '等待有效预览'}<small>${s.mode === 'tags' ? '执行前核对标签变化' : `选中文件大小 ${s.preview && !d.error ? total : '—'} MB · 可在废纸篓中找回`}</small></div><div style="display:flex;gap:8px;flex-wrap:wrap">${wizard ? '<button class="fs-button cursor-interaction" data-step="2">上一步</button>' : ''}<button class="fs-button fs-primary cursor-interaction" data-action="confirm" ${!s.preview || d.error || !d.selected.length ? 'disabled' : ''}>${s.mode === 'tags' ? '确认更新标签' : '确认清理'}${s.preview && !d.error ? ` ${d.selected.length} 个文件` : ''}</button></div></footer>`;
    }
    function completed(s) {
      return `<div class="fs-complete" role="status"><h3>已模拟${s.mode === 'tags' ? '更新' : '处理'} ${s.completed.count} 个文件</h3><p>这是交互演示，实际文件没有改变。</p><p>${s.mode === 'tags' ? '正式应用在这里显示更新结果和失败项。' : '正式应用在这里显示已移到废纸篓、失败和未执行的文件。'}</p><button class="fs-button fs-primary cursor-interaction" data-action="preview">返回示例预览</button></div>`;
    }
    function render() {
      const s = app.state, d = derive(s), mode = modes[s.mode];
      app.el.style.setProperty('--fs-row-pad', shared.compact ? '7px' : '12px');
      const chrome = `<header class="fs-titlebar"><div class="fs-lights" aria-hidden="true"><span></span><span></span><span></span></div><span class="fs-brand">Finder Selection Sync</span><span class="fs-demo">交互草图 · 示例文件</span></header>`;
      const heading = (title = mode.title, subtitle = mode.subtitle) => `<div class="fs-heading"><div><h2>${title}</h2><div class="fs-subtitle">${subtitle}</div></div></div>`;
      let body = '';
      if (app.layout === 'workbench') {
        body = `<div class="fs-body"><nav class="fs-sidebar" aria-label="整理任务"><div class="fs-nav-caption">文件整理</div>${Object.entries(modes).map(([key, m]) => `<button class="fs-nav cursor-interaction" data-mode="${key}" aria-pressed="${s.mode === key}">${icon(m.icon)}${m.title}</button>`).join('')}<div class="fs-side-foot">macOS · 本地处理<br>预览后再执行</div></nav><main class="fs-main">${heading()}${s.completed ? completed(s) : `<section class="fs-config" aria-label="文件夹和规则">${folders(s)}${rules(s)}<div style="display:flex;margin-top:15px"><button class="fs-button cursor-interaction" data-action="preview">${icon('scan-line')}${s.preview ? '重新预览' : '预览结果'}</button></div></section>${resultMarkup(s, d)}${footer(s, d)}`}</main></div>`;
      } else {
        const steps = `<nav class="fs-steps" aria-label="处理步骤">${['选择任务','文件与规则','预览并执行'].map((label, i) => `<button class="fs-step cursor-interaction" data-step="${i + 1}" ${s.step === i + 1 ? 'aria-current="step"' : ''}><b>${i + 1}</b>${label}</button>`).join('')}</nav>`;
        let content = '';
        if (s.completed) content = completed(s);
        else if (s.step === 1) content = `${heading('这次想整理什么？','先选任务，再设置文件夹和匹配规则。')}<div class="fs-task-options">${Object.entries(modes).map(([key, m]) => `<button class="fs-task-option cursor-interaction" data-mode="${key}" aria-pressed="${s.mode === key}">${icon(m.icon)}<span><strong>${m.title}</strong><small>${m.subtitle}</small></span></button>`).join('')}</div><footer class="fs-footer"><span class="fs-count">已选：${mode.title}</span><button class="fs-button fs-primary cursor-interaction" data-step="2">下一步：文件与规则 ${icon('arrow-right')}</button></footer>`;
        else if (s.step === 2) content = `${heading('设置文件与规则',mode.title)}<section class="fs-config">${folders(s)}${rules(s)}</section><footer class="fs-footer"><button class="fs-button cursor-interaction" data-step="1">上一步</button><button class="fs-button fs-primary cursor-interaction" data-action="preview">预览结果 ${icon('arrow-right')}</button></footer>`;
        else content = `${heading('检查后再执行',mode.title)}<div class="fs-config-summary">精选原片 → 导出文件 <button class="fs-button fs-quiet cursor-interaction" data-step="2">修改规则</button></div>${resultMarkup(s,d)}${footer(s,d,true)}`;
        body = `${steps}<main class="fs-wizard-content">${content}</main>`;
      }
      let dialog = '';
      if (s.dialog) dialog = `<div class="fs-overlay"><section class="fs-dialog" role="dialog" aria-modal="true" aria-labelledby="fs-dialog-title-${index}"><h3 id="fs-dialog-title-${index}">${s.mode === 'tags' ? '更新这些文件的标签？' : '将这些文件移到废纸篓？'}</h3><p>目标：旅拍 / 导出文件</p><ul>${d.selected.map(r => `<li>${esc(r.path)}</li>`).join('')}</ul><p>${s.mode === 'tags' ? '按照预览中的标签变化执行。' : '只处理本次勾选的文件。文件夹会保留。'}</p><p>当前为演示，不会修改实际文件。</p><div class="fs-dialog-actions"><button class="fs-button cursor-interaction" data-action="cancel">返回检查</button><button class="fs-button ${s.mode === 'tags' ? 'fs-primary' : 'fs-danger'} cursor-interaction" data-action="execute">${s.mode === 'tags' ? '模拟更新标签' : '模拟移到废纸篓'}</button></div></section></div>`;
      app.el.innerHTML = chrome + body + dialog;
      if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      const box = app.el.querySelector('[data-action="select-all"]');
      if (box) box.indeterminate = d.selected.length > 0 && d.selected.length < d.candidates.length;
      if (s.dialog) {
        Array.from(app.el.children).filter(c => !c.classList.contains('fs-overlay')).forEach(c => c.inert = true);
        app.el.querySelector('[data-action="cancel"]')?.focus();
      }
    }
    app.render = render;
    app.el.addEventListener('click', event => {
      const target = event.target.closest('button');
      if (!target || target.disabled) return;
      const s = app.state;
      if (target.dataset.mode) { s.mode = target.dataset.mode; s.excluded = []; s.completed = null; s.dialog = false; s.preview = true; s.onlyChanges = false; }
      if (target.dataset.step) { s.step = Number(target.dataset.step); s.completed = null; if (s.step === 3) s.preview = true; }
      if (target.dataset.inspect) { s.focused = target.dataset.inspect; }
      const action = target.dataset.action;
      if (action === 'preview') { s.preview = true; s.excluded = []; s.completed = null; if (app.layout === 'wizard') s.step = 3; }
      if (action === 'confirm') { const d = derive(s); if (!d.error && s.preview && d.selected.length) s.dialog = true; }
      if (action === 'cancel') s.dialog = false;
      if (action === 'execute') { const d = derive(s); s.completed = { count: d.selected.length }; s.dialog = false; }
      render();
      if (action === 'cancel') app.el.querySelector('[data-action="confirm"]')?.focus();
      persist();
    });
    app.el.addEventListener('input', event => {
      const target = event.target;
      if (!['reference', 'list'].includes(target.dataset.field)) return;
      app.state[target.dataset.field] = target.value;
      invalidate(400);
      const results = app.el.querySelector('.fs-results');
      if (results) results.outerHTML = '<div class="fs-notice" role="status">条件已变化，正在更新预览…</div>';
      const action = app.el.querySelector('[data-action="confirm"]');
      if (action) action.disabled = true;
      const summary = app.el.querySelector('.fs-footer-summary');
      if (summary) summary.textContent = '等待重新预览';
      persist();
    });
    app.el.addEventListener('change', event => {
      const target = event.target, s = app.state;
      // Preserve text-field focus and the next click after editing a rule.
      if (['reference', 'list'].includes(target.dataset.field)) return;
      if (target.dataset.file) {
        s.excluded = target.checked ? s.excluded.filter(id => id !== target.dataset.file) : [...new Set([...s.excluded, target.dataset.file])];
      } else if (target.dataset.action === 'select-all') {
        s.excluded = target.checked ? [] : derive(s).candidates.map(r => r.id);
      } else if (target.dataset.field) {
        s[target.dataset.field] = target.type === 'checkbox' ? target.checked : target.value;
        if (target.dataset.field !== 'onlyChanges') invalidate();
      }
      render(); persist();
    });
    app.el.addEventListener('keydown', event => {
      if (!app.state.dialog) return;
      if (event.key === 'Escape') { app.state.dialog = false; render(); app.el.querySelector('[data-action="confirm"]')?.focus(); persist(); }
      if (event.key === 'Tab') {
        const buttons = [...app.el.querySelectorAll('.fs-dialog button')];
        if (event.shiftKey && document.activeElement === buttons[0]) { event.preventDefault(); buttons.at(-1).focus(); }
        else if (!event.shiftKey && document.activeElement === buttons.at(-1)) { event.preventDefault(); buttons[0].focus(); }
      }
    });
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: el, onChange: () => apps.forEach(a => a.render()) });
      tweak.addToggle(shared, 'compact', { label: '紧凑文件列表' });
      tweak.addToggle(shared, 'reasons', { label: '显示文件匹配说明' });
    }
  }
  root.querySelectorAll('.fs-app').forEach(makeApp);
  window.addEventListener('openai:set_globals', event => {
    const states = event.detail?.globals?.widgetState?.privateContent?.apps;
    if (Array.isArray(states)) apps.forEach((app, i) => { if (states[i]) { app.state = hydrate(states[i]); app.render(); } });
  });
})();
</script>
